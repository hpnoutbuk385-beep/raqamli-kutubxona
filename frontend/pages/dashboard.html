<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="nav_home">Bosh sahifa</title>
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <div class="page-header">
        <h1 id="greeting">Bosh sahifa</h1>
        <p data-i18n="app_desc">Kutubxona tizimiga xush kelibsiz</p>
      </div>

      <div class="stats-grid" id="myStats">
        <div class="stat-card">
          <div class="stat-icon">📖</div>
          <div class="stat-value" id="statBorrowed">0</div>
          <div class="stat-label" data-i18n="borrowed_books">Olingan kitoblar</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">📋</div>
          <div class="stat-value" id="statReserved">0</div>
          <div class="stat-label" data-i18n="my_reservations">Bronlar</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">🔔</div>
          <div class="stat-value" id="statNotifications">0</div>
          <div class="stat-label" data-i18n="notifications">O'qilmagan xabarlar</div>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
        <div class="card">
          <div class="card-header">
            <h3 data-i18n="recent_books">Oxirgi kitoblar</h3>
            <a href="books.html" class="btn btn-sm btn-outline" data-i18n="all">Barchasi</a>
          </div>
          <div class="card-body" id="recentBooks"><div class="loading-spinner"><div class="spinner"></div></div></div>
        </div>
        <div class="card">
          <div class="card-header">
            <h3 data-i18n="recent_notifications">Oxirgi xabarlar</h3>
            <a href="profile.html" class="btn btn-sm btn-outline" data-i18n="all">Barchasi</a>
          </div>
          <div class="card-body" id="recentNotifs" style="max-height:400px;overflow-y:auto;"><div class="loading-spinner"><div class="spinner"></div></div></div>
        </div>
      </div>
    </main>
  </div>

  <script src="../../js/i18n.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/app.js"></script>
  <script>
    if (!isLoggedIn() || isAdmin()) { window.location.href = '../../'; }
    renderSidebar();
    applyLangToElements();
    loadDashboard();

    function refreshPage() { loadDashboard(); applyLangToElements(); }

    async function loadDashboard() {
      const user = getUser();
      document.getElementById('greeting').textContent = t('welcome') + ', ' + getUserFullName(user) + '!';

      try {
        const [borrowings, reservations, notifs, notifCount] = await Promise.all([
          api.borrowing.my(), api.reservations.list(), api.notifications.list(), api.notifications.unreadCount(),
        ]);

        document.getElementById('statBorrowed').textContent = borrowings.filter(b => b.status === 'borrowed').length;
        document.getElementById('statReserved').textContent = reservations.filter(r => r.status === 'reserved').length;
        document.getElementById('statNotifications').textContent = notifCount.count;

        const bc = document.getElementById('recentBooks');
        if (borrowings.length === 0) {
          showEmpty(bc, '📖', t('no_books_yet'), t('no_books_desc'));
        } else {
          bc.innerHTML = borrowings.slice(0, 5).map((b, i) => `
            <div style="display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #f3f4f6;">
              <div style="width:40px;height:40px;border-radius:8px;background:${getBookColor(i)};display:flex;align-items:center;justify-content:center;color:white;font-size:18px;">📖</div>
              <div style="flex:1;">
                <div style="font-weight:600;font-size:14px;">${b.book_title}</div>
                <div style="font-size:12px;color:#6b7280;">${b.author_name || ''}</div>
                <div style="margin-top:4px;">${statusBadge(b.status)}</div>
              </div>
            </div>
          `).join('');
        }

        const nc = document.getElementById('recentNotifs');
        if (notifs.length === 0) {
          showEmpty(nc, '🔔', t('no_notifications'), t('no_notifications_desc'));
        } else {
          nc.innerHTML = notifs.slice(0, 10).map(n => `
            <div class="notification-item ${n.is_read ? '' : 'unread'}">
              <div class="notif-title">${n.title}</div>
              <div class="notif-message">${n.message}</div>
              <div class="notif-time">${formatDateTime(n.created_at)}</div>
            </div>
          `).join('');
        }
      } catch (err) { console.error(err); }
    }
  </script>
</body>
</html>
