<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bosh sahifa - Kutubxona</title>
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <div class="page-header">
        <h1 id="greeting">Bosh sahifa</h1>
        <p>Kutubxona tizimiga xush kelibsiz</p>
      </div>

      <div class="stats-grid" id="myStats">
        <div class="stat-card">
          <div class="stat-icon">📖</div>
          <div class="stat-value" id="statBorrowed">0</div>
          <div class="stat-label">Olingan kitoblar</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">📋</div>
          <div class="stat-value" id="statReserved">0</div>
          <div class="stat-label">Bronlar</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">🔔</div>
          <div class="stat-value" id="statNotifications">0</div>
          <div class="stat-label">O'qilmagan xabarlar</div>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
        <div class="card">
          <div class="card-header">
            <h3>Oxirgi kitoblar</h3>
            <a href="books.html" class="btn btn-sm btn-outline">Barchasi</a>
          </div>
          <div class="card-body" id="recentBooks">
            <div class="loading-spinner"><div class="spinner"></div></div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <h3>Oxirgi xabarlar</h3>
            <a href="profile.html" class="btn btn-sm btn-outline">Barchasi</a>
          </div>
          <div class="card-body" id="recentNotifs" style="max-height:400px;overflow-y:auto;">
            <div class="loading-spinner"><div class="spinner"></div></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/app.js"></script>
  <script>
    if (!isLoggedIn() || isAdmin()) { window.location.href = '../../'; }
    renderSidebar();
    loadDashboard();

    async function loadDashboard() {
      const user = getUser();
      document.getElementById('greeting').textContent = `Xush kelibsiz, ${getUserFullName(user)}!`;

      try {
        const [borrowings, reservations, notifs, notifCount] = await Promise.all([
          api.borrowing.my(),
          api.reservations.list(),
          api.notifications.list(),
          api.notifications.unreadCount(),
        ]);

        const activeBorrowed = borrowings.filter(b => b.status === 'borrowed').length;
        const activeReserved = reservations.filter(r => r.status === 'reserved').length;

        document.getElementById('statBorrowed').textContent = activeBorrowed;
        document.getElementById('statReserved').textContent = activeReserved;
        document.getElementById('statNotifications').textContent = notifCount.count;

        const booksContainer = document.getElementById('recentBooks');
        if (borrowings.length === 0) {
          showEmpty(booksContainer, '📖', 'Hali kitob yo\'q', 'Siz hali kitob olmadingiz');
        } else {
          booksContainer.innerHTML = borrowings.slice(0, 5).map((b, i) => `
            <div style="display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #f3f4f6;">
              <div style="width:40px;height:40px;border-radius:8px;background:${getBookColor(i)};display:flex;align-items:center;justify-content:center;color:white;font-size:18px;">📖</div>
              <div style="flex:1;">
                <div style="font-weight:600;font-size:14px;">${b.book_title}</div>
                <div style="font-size:12px;color:#6b7280;">${b.author_name || ''}</div>
                <div style="margin-top:4px;">${statusBadge(b.status)}</div>
              </div>
            </div>
          `).join('');
        }

        const notifsContainer = document.getElementById('recentNotifs');
        if (notifs.length === 0) {
          showEmpty(notifsContainer, '🔔', 'Xabarlar yo\'q', 'Hali xabarlar yo\'q');
        } else {
          notifsContainer.innerHTML = notifs.slice(0, 10).map(n => `
            <div class="notification-item ${n.is_read ? '' : 'unread'}">
              <div class="notif-title">${n.title}</div>
              <div class="notif-message">${n.message}</div>
              <div class="notif-time">${formatDateTime(n.created_at)}</div>
            </div>
          `).join('');
        }
      } catch (err) {
        console.error(err);
      }
    }
  </script>
</body>
</html>
