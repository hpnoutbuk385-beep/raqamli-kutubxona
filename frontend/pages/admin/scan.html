<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="nav_scan">QR Scanner</title>
  <link rel="icon" type="image/svg+xml" href="../../../images/favicon.svg">
  <link rel="stylesheet" href="../../../css/style.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <div class="page-header"><h1>рџ“· <span data-i18n="scan_title">QR Scanner</span></h1><p data-i18n="scan_subtitle">QR kodni skanerlang yoki token kiriting</p></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;">
        <div class="card"><div class="card-header"><h3>рџ“· <span data-i18n="scan_qr">QR Kodni skanerlang</span></h3></div>
          <div class="card-body"><div class="scanner-area"><div class="scanner-icon">рџ“·</div><p data-i18n="scan_camera_desc">QR kod kamerangiz orqali skanerlang</p><div id="reader" style="width:100%;max-width:400px;margin:0 auto;"></div><button class="btn btn-primary mt-4" onclick="startScanner()" id="scanBtn" data-i18n="camera_on">Kamerani yoqish</button></div></div></div>
        <div class="card"><div class="card-header"><h3>вЊЁпёЏ <span data-i18n="enter_token">QR Token kiriting</span></h3></div>
          <div class="card-body"><div class="form-group"><label data-i18n="enter_token">QR Token / Reservation ID</label><input type="text" class="form-control" id="tokenInput" data-i18n-placeholder="token_placeholder" placeholder="Token kiriting yoki QR kodni yozing"></div><button class="btn btn-primary btn-full" onclick="lookupToken()">рџ”Ќ <span data-i18n="search">Qidirish</span></button></div></div>
      </div>
      <div id="resultSection" class="card mt-4" style="display:none;"><div class="card-header"><h3>рџ“– <span data-i18n="reservation_info">Bron ma'lumotlari</span></h3></div><div class="card-body" id="resultContent"></div></div>
      <div id="successSection" class="card mt-4" style="display:none;"><div class="card-body"><div class="success-animation"><div class="check-icon">вњ…</div><h2 id="successTitle">Kitob muvaffaqiyatli berildi!</h2><div id="successDetails"></div></div></div></div>
    </main>
  </div>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="../../../js/i18n.js?v=1785013902"></script>
  <script src="../../../js/api.js?v=1785013902"></script>
  <script src="../../../js/auth.js?v=1785013902"></script>
  <script src="../../../js/app.js?v=1785013902"></script>
  <script>
    if (!isLoggedIn() || !isAdmin()) window.location.href = '../../';
    renderSidebar(); applyLangToElements();
    function refreshPage() { applyLangToElements(); }
    let html5QrCode = null;
    function startScanner() {
      const btn = document.getElementById('scanBtn');
      if (html5QrCode && html5QrCode.isScanning) { html5QrCode.stop().then(() => { btn.textContent = t('camera_on'); }); return; }
      html5QrCode = new Html5Qrcode('reader');
      html5QrCode.start({ facingMode: 'environment' }, { fps: 10, qrbox: 250 }, (decodedText) => { document.getElementById('tokenInput').value = decodedText; html5QrCode.stop(); btn.textContent = t('camera_on'); lookupToken(); }, () => {}).then(() => { btn.textContent = t('camera_off'); }).catch(err => { alert(t('camera_error') + ': ' + err); });
    }
    async function lookupToken() {
      const token = document.getElementById('tokenInput').value.trim(); if (!token) return;
      document.getElementById('resultSection').style.display = 'block'; document.getElementById('successSection').style.display = 'none';
      document.getElementById('resultContent').innerHTML = '<div class="loading-spinner"><div class="spinner"></div></div>';
      try {
        const result = await api.borrowing.confirm(token);
        document.getElementById('resultSection').style.display = 'none'; document.getElementById('successSection').style.display = 'block';
        document.getElementById('successTitle').textContent = t('book_given_success');
        document.getElementById('successDetails').innerHTML = `<div style="text-align:left;max-width:400px;margin:16px auto;background:#f9fafb;padding:16px;border-radius:8px;">
          <div class="qr-info-row"><span class="qr-info-label">рџ“љ ${t('book')}:</span><span class="qr-info-value">${result.book_title}</span></div>
          <div class="qr-info-row"><span class="qr-info-label">рџ‘¤ ${t('user')}:</span><span class="qr-info-value">${result.user_name}</span></div>
          <div class="qr-info-row"><span class="qr-info-label">рџ“… ${t('due_days')}:</span><span class="qr-info-value">${result.due_days || 7} ${t('days_label')}</span></div>
          <div class="qr-info-row"><span class="qr-info-label">рџ“… ${t('due_date')}:</span><span class="qr-info-value">${formatDateTime(result.due_date)}</span></div>
          <div class="qr-info-row"><span class="qr-info-label">рџ’° ${t('total_price')}:</span><span class="qr-info-value" style="font-size:16px;font-weight:700;color:#2563eb;">${(result.total_price || 0).toLocaleString()} so'm</span></div>
          <div class="qr-info-row"><span class="qr-info-label">рџ†” ${t('return_id')}:</span><span class="qr-info-value return-id" style="font-size:24px;background:#fef3c7;padding:8px 16px;border-radius:6px;display:inline-block;margin:8px 0;">${result.return_id}</span></div>
          <div class="qr-info-row"><span class="qr-info-label">вљ пёЏ</span><span class="qr-info-value" style="font-size:13px;color:#d97706;">${t('return_id_hint')}</span></div></div>
          <button class="btn btn-primary mt-4" onclick="resetScanner()">рџ”„ ${t('new_scan')}</button>`;
      } catch (err) { document.getElementById('resultContent').innerHTML = `<div class="alert alert-error">${err.message}</div>`; }
    }
    function resetScanner() { document.getElementById('resultSection').style.display = 'none'; document.getElementById('successSection').style.display = 'none'; document.getElementById('tokenInput').value = ''; }
  </script>
</body>
</html>
