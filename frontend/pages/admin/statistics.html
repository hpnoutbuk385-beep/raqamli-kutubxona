<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="statistics">Statistika</title>
  <link rel="icon" type="image/svg+xml" href="../../../images/favicon.svg">
  <link rel="stylesheet" href="../../../css/style.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <div class="page-header"><h1>рџ“€ <span data-i18n="statistics">Statistika</span></h1><p data-i18n="statistics_desc">Kutubxona statistikasi va hisobotlari</p></div>
      <div class="stats-grid">
        <div class="stat-card" style="border-left:4px solid var(--primary);"><div class="stat-value" id="st1">-</div><div class="stat-label" data-i18n="total_books">Jami kitoblar</div></div>
        <div class="stat-card" style="border-left:4px solid var(--success);"><div class="stat-value" id="st2">-</div><div class="stat-label" data-i18n="available_books">Mavjud nusxalar</div></div>
        <div class="stat-card" style="border-left:4px solid var(--warning);"><div class="stat-value" id="st3">-</div><div class="stat-label" data-i18n="active_reservations">Faol bronlar</div></div>
        <div class="stat-card" style="border-left:4px solid var(--danger);"><div class="stat-value" id="st4">-</div><div class="stat-label" data-i18n="active_borrowings">Olingan kitoblar</div></div>
        <div class="stat-card" style="border-left:4px solid var(--info);"><div class="stat-value" id="st5">-</div><div class="stat-label" data-i18n="total_students">O'quvchilar</div></div>
        <div class="stat-card" style="border-left:4px solid #7c3aed;"><div class="stat-value" id="st6">-</div><div class="stat-label" data-i18n="total_teachers">O'qituvchilar</div></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
        <div class="card"><div class="card-header"><h3 data-i18n="today_activity">Bugungi faoliyat</h3></div><div class="card-body"><div id="todayStats"><div class="loading-spinner"><div class="spinner"></div></div></div></div></div>
        <div class="card"><div class="card-header"><h3 data-i18n="popular_books">Eng ko'p o'qilgan kitoblar</h3></div><div class="card-body" id="popularBooksStats"><div class="loading-spinner"><div class="spinner"></div></div></div></div>
      </div>
      <div class="card mt-4"><div class="card-header"><h3 data-i18n="borrowing_history">Barcha bronlar tarixi</h3><button class="btn btn-sm btn-outline" onclick="loadAllBorrowings()" data-i18n="refresh">рџ”„ Yangilash</button></div><div class="card-body"><div class="table-container" id="allBorrowings"><div class="loading-spinner"><div class="spinner"></div></div></div></div></div>
    </main>
  </div>
  <script src="../../../js/i18n.js?v=1785013902"></script>
  <script src="../../../js/api.js?v=1785013902"></script>
  <script src="../../../js/auth.js?v=1785013902"></script>
  <script src="../../../js/app.js?v=1785013902"></script>
  <script>
    if (!isLoggedIn() || !isAdmin()) window.location.href = '../../';
    renderSidebar(); applyLangToElements();
    function refreshPage() { init(); applyLangToElements(); }
    async function init() {
      try {
        const stats = await api.admin.stats();
        document.getElementById('st1').textContent = stats.total_books;
        document.getElementById('st2').textContent = stats.available_books;
        document.getElementById('st3').textContent = stats.active_reservations;
        document.getElementById('st4').textContent = stats.active_borrowings;
        document.getElementById('st5').textContent = stats.total_students;
        document.getElementById('st6').textContent = stats.total_teachers;
        document.getElementById('todayStats').innerHTML = `<div style="display:grid;gap:12px;">
          <div style="display:flex;justify-content:space-between;padding:12px;background:#f9fafb;border-radius:8px;"><span>рџ“‹ ${t('today_reservations')}</span><strong>${stats.today_reservations}</strong></div>
          <div style="display:flex;justify-content:space-between;padding:12px;background:#f9fafb;border-radius:8px;"><span>рџ“– ${t('today_borrowed')}</span><strong>${stats.today_borrowed}</strong></div>
          <div style="display:flex;justify-content:space-between;padding:12px;background:#f9fafb;border-radius:8px;"><span>вњ… ${t('today_returned')}</span><strong>${stats.today_returned}</strong></div>
          <div style="display:flex;justify-content:space-between;padding:12px;background:${stats.overdue_count > 0 ? '#fee2e2' : '#f9fafb'};border-radius:8px;"><span>вљ пёЏ ${t('overdue_count')}</span><strong style="color:${stats.overdue_count > 0 ? '#dc2626' : '#111827'};">${stats.overdue_count}</strong></div></div>`;
        const popular = await api.admin.popularBooks(); const pc = document.getElementById('popularBooksStats');
        if (popular.length === 0) showEmpty(pc, 'рџ“љ', t('no_data_yet'), ''); else pc.innerHTML = popular.map((b, i) => `<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #f3f4f6;"><div style="width:32px;height:32px;border-radius:50%;background:var(--primary);color:white;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;">${i+1}</div><div style="flex:1;"><div style="font-weight:600;font-size:14px;">${b.title}</div><div style="font-size:12px;color:#6b7280;">${b.author_name || ''}</div></div><span class="badge badge-student">${b.borrow_count} ${t('times')}</span></div>`).join('');
      } catch (err) { console.error(err); }
      loadAllBorrowings();
    }
    async function loadAllBorrowings() {
      try { const borrowings = await api.borrowing.all(); const c = document.getElementById('allBorrowings');
        if (borrowings.length === 0) { showEmpty(c, 'рџ“‹', t('no_history'), ''); return; }
        c.innerHTML = `<table><thead><tr><th>${t('book')}</th><th>${t('user')}</th><th>${t('user_type')}</th><th>${t('class')}</th><th>${t('return_id')}</th><th>${t('borrowed_at')}</th><th>${t('due')}</th><th>${t('status')}</th></tr></thead><tbody>
          ${borrowings.slice(0, 50).map(b => `<tr class="${b.status === 'borrowed' && isOverdue(b.due_date) ? 'overdue-row' : ''}"><td><strong>${b.book_title}</strong></td><td>${b.user_name}</td><td>${roleBadge(b.user_type)}</td><td>${b.class_name || '-'}</td><td><code style="background:#f3f4f6;padding:2px 8px;border-radius:4px;font-size:12px;">${b.return_id}</code></td><td>${formatDate(b.borrowed_at)}</td><td>${formatDate(b.due_date)}</td><td>${b.status === 'returned' ? `<span class="badge badge-returned">${t('returned')}</span>` : isOverdue(b.due_date) ? `<span class="badge badge-overdue">${t('overdue')}</span>` : `<span class="badge badge-borrowed">${t('borrowed')}</span>`}</td></tr>`).join('')}</tbody></table>`;
      } catch (err) { document.getElementById('allBorrowings').innerHTML = `<div class="alert alert-error">${err.message}</div>`; }
    }
    init();
  </script>
  <style>.overdue-row{background:#fee2e2!important;}.overdue-row:hover{background:#fecaca!important;}</style>
</body>
</html>
