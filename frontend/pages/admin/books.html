<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="manage_books">Kitoblar boshqaruvi</title>
  <link rel="icon" type="image/svg+xml" href="../../../images/favicon.svg">
  <link rel="stylesheet" href="../../../css/style.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <div class="page-header flex justify-between items-center">
        <div><h1 data-i18n="manage_books">📚 Kitoblar</h1><p data-i18n="manage_books_desc">Kitoblarni boshqarish</p></div>
        <button class="btn btn-primary" onclick="openAddBook()">+ <span data-i18n="add_book">Kitob qo'shish</span></button>
      </div>
      <div class="search-bar"><div class="search-input"><span class="search-icon">🔍</span><input type="text" id="searchInput" data-i18n-placeholder="book_search" placeholder="Kitob qidirish..." oninput="debounceSearch()"></div></div>
      <div class="card"><div class="table-container" id="booksTable"><div class="loading-spinner"><div class="spinner"></div></div></div></div>
      <div id="bookModal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeModal()">
        <div class="modal">
          <div class="modal-header"><h2 id="modalTitle">Kitob</h2><button class="modal-close" onclick="closeModal()">&times;</button></div>
          <div class="modal-body"><form id="bookForm" onsubmit="saveBook(event)">
            <input type="hidden" id="bookId">
            <div class="form-group"><label data-i18n="book_title_label">Kitob nomi *</label><input type="text" class="form-control" id="bookTitle" required></div>
            <div class="form-row"><div class="form-group"><label>ISBN</label><input type="text" class="form-control" id="bookIsbn"></div><div class="form-group"><label data-i18n="published_year">Nashr yili</label><input type="number" class="form-control" id="bookYear"></div></div>
            <div class="form-row"><div class="form-group"><label data-i18n="author">Muallif</label><select class="form-control" id="bookAuthor"><option value="">-</option></select></div><div class="form-group"><label data-i18n="category">Kategoriya</label><select class="form-control" id="bookCategory"><option value="">-</option></select></div></div>
            <div class="form-group"><label data-i18n="publisher">Nashriyot</label><input type="text" class="form-control" id="bookPublisher"></div>
            <div class="form-row"><div class="form-group"><label data-i18n="total_copies">Jami nusxa</label><input type="number" class="form-control" id="bookCopies" value="1" min="1"></div><div class="form-group"><label data-i18n="shelf_number">Javon raqami</label><input type="text" class="form-control" id="bookShelf"></div></div>
            <div class="form-group"><label data-i18n="daily_fee">Kunlik narx (so'm) *</label><input type="number" class="form-control" id="bookFee" value="1000" min="0" required></div>
            <div class="form-group"><label data-i18n="description">Tavsif</label><textarea class="form-control" id="bookDesc" rows="3"></textarea></div>
            <div class="modal-footer" style="padding:0;border:none;margin-top:16px;"><button type="button" class="btn btn-outline" onclick="closeModal()" data-i18n="cancel">Bekor</button><button type="submit" class="btn btn-primary" data-i18n="save">Saqlash</button></div>
          </form></div>
        </div>
      </div>
    </main>
  </div>
  <script src="../../../js/i18n.js?v=2"></script>
  <script src="../../../js/api.js?v=2"></script>
  <script src="../../../js/auth.js?v=2"></script>
  <script src="../../../js/app.js?v=2"></script>
  <script>
    if (!isLoggedIn() || !isAdmin()) window.location.href = '../../';
    renderSidebar(); applyLangToElements();
    function refreshPage() { loadBooks(); applyLangToElements(); }
    let searchTimeout; let authors = []; let categories = [];
    async function init() { try { [authors, categories] = await Promise.all([api.books.authors(), api.books.categories()]); const as = document.getElementById('bookAuthor'); const cs = document.getElementById('bookCategory'); authors.forEach(a => { const o = document.createElement('option'); o.value = a.id; o.textContent = a.name; as.appendChild(o); }); categories.forEach(c => { const o = document.createElement('option'); o.value = c.id; o.textContent = c.name; cs.appendChild(o); }); } catch(e) {} loadBooks(); }
    function debounceSearch() { clearTimeout(searchTimeout); searchTimeout = setTimeout(loadBooks, 300); }
    async function loadBooks() {
      const container = document.getElementById('booksTable');
      try { const search = document.getElementById('searchInput').value; const books = await api.books.list(search ? { search } : {});
        if (books.length === 0) { container.innerHTML = `<div class="empty-state"><div class="empty-icon">📚</div><h3>${t('no_books')}</h3></div>`; return; }
        container.innerHTML = `<table><thead><tr><th>${t('book')}</th><th>${t('author')}</th><th>${t('category')}</th><th>ISBN</th><th>${t('available_copies')}</th><th>${t('shelf')}</th><th>${t('daily_fee')}</th><th>${t('status')}</th><th>${t('actions')}</th></tr></thead><tbody>
          ${books.map(b => `<tr><td><strong>${b.title}</strong></td><td>${b.author_name || '-'}</td><td>${b.category_name || '-'}</td><td><code style="font-size:12px;background:#f3f4f6;padding:2px 6px;border-radius:4px;">${b.isbn || '-'}</code></td><td><span style="color:${b.available_copies > 0 ? '#16a34a' : '#dc2626'};font-weight:600;">${b.available_copies}/${b.total_copies}</span></td><td>${b.shelf_number || '-'}</td><td><strong style="color:#d97706;">${(b.daily_fee || 1000).toLocaleString()} so'm</strong></td><td>${b.available_copies > 0 ? `<span class="badge badge-available">${t('available')}</span>` : `<span class="badge badge-borrowed">${t('unavailable')}</span>`}</td><td><button class="btn btn-sm btn-outline" onclick="editBook('${b.id}')">✏️</button> <button class="btn btn-sm btn-danger" onclick="deleteBook('${b.id}','${b.title.replace(/'/g, "\\'")}')">🗑️</button></td></tr>`).join('')}
        </tbody></table>`;
      } catch (err) { container.innerHTML = `<div class="alert alert-error">${err.message}</div>`; }
    }
    function openAddBook() { document.getElementById('modalTitle').textContent = t('add_book'); document.getElementById('bookForm').reset(); document.getElementById('bookId').value = ''; document.getElementById('bookFee').value = 1000; document.getElementById('bookModal').style.display = 'flex'; }
    async function editBook(id) { try { const b = await api.books.get(id); document.getElementById('modalTitle').textContent = t('edit_book'); document.getElementById('bookId').value = b.id; document.getElementById('bookTitle').value = b.title; document.getElementById('bookIsbn').value = b.isbn || ''; document.getElementById('bookYear').value = b.published_year || ''; document.getElementById('bookAuthor').value = b.author_id || ''; document.getElementById('bookCategory').value = b.category_id || ''; document.getElementById('bookPublisher').value = b.publisher || ''; document.getElementById('bookCopies').value = b.total_copies; document.getElementById('bookShelf').value = b.shelf_number || ''; document.getElementById('bookFee').value = b.daily_fee || 1000; document.getElementById('bookDesc').value = b.description || ''; document.getElementById('bookModal').style.display = 'flex'; } catch (err) { alert(err.message); } }
    async function saveBook(e) { e.preventDefault(); const id = document.getElementById('bookId').value; const data = { title: document.getElementById('bookTitle').value, isbn: document.getElementById('bookIsbn').value || null, published_year: parseInt(document.getElementById('bookYear').value) || null, author_id: document.getElementById('bookAuthor').value || null, category_id: document.getElementById('bookCategory').value || null, publisher: document.getElementById('bookPublisher').value || null, total_copies: parseInt(document.getElementById('bookCopies').value) || 1, shelf_number: document.getElementById('bookShelf').value || null, daily_fee: parseInt(document.getElementById('bookFee').value) || 1000, description: document.getElementById('bookDesc').value || null, language: "O'zbek" }; try { if (id) await api.books.update(id, data); else await api.books.create(data); closeModal(); loadBooks(); } catch (err) { alert(err.message); } }
    async function deleteBook(id, title) { if (!confirm(`"${title}" ${t('delete_book_confirm')}`)) return; try { await api.books.delete(id); loadBooks(); } catch (err) { alert(err.message); } }
    function closeModal() { document.getElementById('bookModal').style.display = 'none'; }
    init();
  </script>
</body>
</html>
