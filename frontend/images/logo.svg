<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="book1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="book2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#93c5fd"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="96" fill="url(#bg)" stroke="#1e40af" stroke-width="2"/>
  
  <!-- Left book -->
  <g transform="translate(35, 45) rotate(-15, 30, 50)">
    <rect x="5" y="5" width="50" height="70" rx="3" fill="url(#book1)" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="10" y="10" width="40" height="5" rx="2" fill="white" opacity="0.9"/>
    <rect x="10" y="20" width="30" height="3" rx="1.5" fill="white" opacity="0.5"/>
    <rect x="10" y="27" width="35" height="3" rx="1.5" fill="white" opacity="0.5"/>
    <rect x="10" y="34" width="25" height="3" rx="1.5" fill="white" opacity="0.5"/>
    <rect x="10" y="45" width="40" height="3" rx="1.5" fill="white" opacity="0.3"/>
    <rect x="10" y="52" width="35" height="3" rx="1.5" fill="white" opacity="0.3"/>
    <line x1="5" y1="5" x2="5" y2="75" stroke="#1d4ed8" stroke-width="2"/>
  </g>
  
  <!-- Right book -->
  <g transform="translate(105, 40) rotate(12, 30, 50)">
    <rect x="5" y="5" width="50" height="70" rx="3" fill="url(#book2)" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="10" y="10" width="40" height="5" rx="2" fill="white" opacity="0.9"/>
    <rect x="10" y="20" width="32" height="3" rx="1.5" fill="white" opacity="0.5"/>
    <rect x="10" y="27" width="38" height="3" rx="1.5" fill="white" opacity="0.5"/>
    <rect x="10" y="34" width="28" height="3" rx="1.5" fill="white" opacity="0.5"/>
    <rect x="10" y="45" width="40" height="3" rx="1.5" fill="white" opacity="0.3"/>
    <rect x="10" y="52" width="30" height="3" rx="1.5" fill="white" opacity="0.3"/>
    <line x1="5" y1="5" x2="5" y2="75" stroke="#2563eb" stroke-width="2"/>
  </g>
  
  <!-- Center bookmark -->
  <g transform="translate(88, 30)">
    <path d="M0,0 L24,0 L24,55 L12,42 L0,55 Z" fill="#f59e0b" stroke="#d97706" stroke-width="1"/>
  </g>
  
  <!-- Text -->
  <text x="100" y="145" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="white">KUTUBXONA</text>
  <text x="100" y="165" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#93c5fd" letter-spacing="3">LIBRARY</text>
  
  <!-- Decorative dots -->
  <circle cx="55" cy="175" r="2" fill="#60a5fa" opacity="0.6"/>
  <circle cx="100" cy="175" r="2" fill="#60a5fa" opacity="0.8"/>
  <circle cx="145" cy="175" r="2" fill="#60a5fa" opacity="0.6"/>
</svg>
