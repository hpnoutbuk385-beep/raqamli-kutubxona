<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="app_name">Maktab Kutubxonasi</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-page" id="loginPage">
    <div class="login-container">
      <div class="login-lang" id="loginLang"></div>
      <div class="login-logo">
        <img src="images/logo.svg" alt="Logo" style="width:120px;height:120px;margin-bottom:12px;">
        <h1 data-i18n="app_name">Maktab Kutubxonasi</h1>
        <p data-i18n="app_desc">Library Management System</p>
      </div>

      <div class="tabs">
        <button class="tab active" onclick="showTab('login')" data-i18n="login">Kirish</button>
        <button class="tab" onclick="showTab('register')" data-i18n="register">Ro'yxatdan o'tish</button>
      </div>

      <div id="errorAlert" class="alert alert-error" style="display:none"></div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label data-i18n="username">Login</label>
          <input type="text" class="form-control" id="loginUsername" data-i18n-placeholder="login_placeholder" placeholder="Loginni kiriting" required>
        </div>
        <div class="form-group">
          <label data-i18n="password">Parol</label>
          <input type="password" class="form-control" id="loginPassword" data-i18n-placeholder="password_placeholder" placeholder="Parolni kiriting" required>
        </div>
        <button type="submit" class="btn btn-primary btn-full btn-lg" id="loginBtn" data-i18n="login_btn">Kirish</button>
        <p style="text-align:center;margin-top:16px;font-size:13px;color:#6b7280" data-i18n="test_hint">Test: admin / admin123</p>
      </form>

      <form id="registerForm" style="display:none" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label data-i18n="user_type">Foydalanuvchi turi</label>
          <select class="form-control" id="regRole" onchange="toggleRegFields()">
            <option value="student" data-i18n="student">O'quvchi</option>
            <option value="teacher" data-i18n="teacher">O'qituvchi</option>
          </select>
        </div>
        <div class="form-group">
          <label data-i18n="username">Login</label>
          <input type="text" class="form-control" id="regUsername" data-i18n-placeholder="login_placeholder" placeholder="Login yarating" required>
        </div>
        <div class="form-group">
          <label data-i18n="password">Parol</label>
          <input type="password" class="form-control" id="regPassword" data-i18n-placeholder="password_placeholder" placeholder="Parol yarating" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label data-i18n="first_name">Ism</label>
            <input type="text" class="form-control" id="regFirstName" data-i18n-placeholder="first_name" placeholder="Ism" required>
          </div>
          <div class="form-group">
            <label data-i18n="last_name">Familiya</label>
            <input type="text" class="form-control" id="regLastName" data-i18n-placeholder="last_name" placeholder="Familiya" required>
          </div>
        </div>
        <div class="form-group">
          <label data-i18n="phone">Telefon</label>
          <input type="text" class="form-control" id="regPhone" data-i18n-placeholder="phone_placeholder" placeholder="+998 XX XXX XX XX">
        </div>
        <div id="studentFields">
          <div class="form-row">
            <div class="form-group">
              <label data-i18n="class">Sinf</label>
              <select class="form-control" id="regClassNumber">
                <option value="1">1-sinf</option><option value="2">2-sinf</option><option value="3">3-sinf</option>
                <option value="4">4-sinf</option><option value="5">5-sinf</option><option value="6">6-sinf</option>
                <option value="7">7-sinf</option><option value="8">8-sinf</option>
                <option value="9" selected>9-sinf</option><option value="10">10-sinf</option><option value="11">11-sinf</option>
              </select>
            </div>
            <div class="form-group">
              <label data-i18n="class_letter">Sinf harfi</label>
              <select class="form-control" id="regClassLetter">
                <option value="A">A</option><option value="B" selected>B</option><option value="V">V</option>
                <option value="G">G</option><option value="E">E</option>
              </select>
            </div>
          </div>
        </div>
        <div id="teacherFields" style="display:none">
          <div class="form-group">
            <label data-i18n="subject">Fan</label>
            <input type="text" class="form-control" id="regSubject" data-i18n-placeholder="subject_placeholder" placeholder="Fan nomi">
          </div>
          <div class="form-group">
            <label data-i18n="position">Lavozim</label>
            <input type="text" class="form-control" id="regPosition" data-i18n-placeholder="position_placeholder" placeholder="Lavozim">
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-full btn-lg" id="regBtn" data-i18n="register_btn">Ro'yxatdan o'tish</button>
      </form>
    </div>
  </div>

  <script src="js/i18n.js?v=1785079262"></script>
  <script src="js/api.js?v=1785079262"></script>
  <script src="js/auth.js?v=1785079262"></script>
  <script>
    if (isLoggedIn()) {
      const user = getUser();
      if (user.role === 'admin') window.location.href = 'pages/admin/dashboard.html';
      else window.location.href = 'pages/dashboard.html';
    }

    function renderLoginLang() {
      const container = document.getElementById('loginLang');
      container.innerHTML = langOptions().map(l => `
        <button class="lang-btn ${l.code === getLang() ? 'active' : ''}" onclick="loginSwitchLang('${l.code}')">
          ${l.flag} ${l.label}
        </button>
      `).join('');
    }

    function loginSwitchLang(lang) {
      setLanguage(lang);
      applyLangToElements();
      renderLoginLang();
      document.title = t('app_name');
    }

    renderLoginLang();
    applyLangToElements();

    function showTab(tab) {
      document.querySelectorAll('.tab').forEach((t, i) => {
        t.classList.toggle('active', (tab === 'login' && i === 0) || (tab === 'register' && i === 1));
      });
      document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
      document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
      hideError();
    }

    function toggleRegFields() {
      const role = document.getElementById('regRole').value;
      document.getElementById('studentFields').style.display = role === 'student' ? 'block' : 'none';
      document.getElementById('teacherFields').style.display = role === 'teacher' ? 'block' : 'none';
    }

    function showError(msg) {
      const el = document.getElementById('errorAlert');
      el.textContent = msg;
      el.style.display = 'block';
    }

    function hideError() {
      document.getElementById('errorAlert').style.display = 'none';
    }

    async function handleLogin(e) {
      e.preventDefault();
      hideError();
      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.textContent = t('logging_in');
      try {
        const data = await api.auth.login(
          document.getElementById('loginUsername').value,
          document.getElementById('loginPassword').value
        );
        saveAuth(data.token, data.user);
        if (data.user.role === 'admin') window.location.href = 'pages/admin/dashboard.html';
        else window.location.href = 'pages/dashboard.html';
      } catch (err) {
        showError(err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = t('login_btn');
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      hideError();
      const btn = document.getElementById('regBtn');
      btn.disabled = true;
      btn.textContent = t('creating');
      try {
        const role = document.getElementById('regRole').value;
        const profile = {};
        if (role === 'student') {
          profile.first_name = document.getElementById('regFirstName').value;
          profile.last_name = document.getElementById('regLastName').value;
          profile.phone = document.getElementById('regPhone').value;
          profile.class_number = parseInt(document.getElementById('regClassNumber').value);
          profile.class_letter = document.getElementById('regClassLetter').value;
        } else {
          profile.first_name = document.getElementById('regFirstName').value;
          profile.last_name = document.getElementById('regLastName').value;
          profile.phone = document.getElementById('regPhone').value;
          profile.subject = document.getElementById('regSubject').value;
          profile.position = document.getElementById('regPosition').value;
        }

        const data = await api.auth.register({
          username: document.getElementById('regUsername').value,
          password: document.getElementById('regPassword').value,
          role,
          profile,
        });
        saveAuth(data.token, data.user);
        window.location.href = 'pages/dashboard.html';
      } catch (err) {
        showError(err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = t('register_btn');
      }
    }
  </script>
</body>
</html>
